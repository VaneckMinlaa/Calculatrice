version: '3.8'

# ========================================
# Development Docker Compose Configuration
# ========================================
# This configuration is optimized for development
# Features:
# - Volume mounts for hot reload
# - Debug ports exposed
# - Development profiles
# ========================================

services:
  # PostgreSQL Database (same as production)
  postgres-db:
    image: postgres:15-alpine
    container_name: calculatrice-postgres-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=calculatrice_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - calculatrice-network

  # pgAdmin - PostgreSQL Web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: calculatrice-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@calculatrice.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - calculatrice-network
    depends_on:
      - postgres-db

networks:
  calculatrice-network:
    driver: bridge

volumes:
  postgres-dev-data:
  pgadmin-data:

