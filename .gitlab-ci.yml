# ========================================
# GitLab CI/CD Pipeline Configuration 
# ========================================

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  JAVA_VERSION: "17"
  
  # PostgreSQL
  POSTGRES_DB: "calculatrice_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "root"
  
  # Deployment
  DEPLOY_USER: "deployer"
  DEPLOY_HOST: "${DEPLOY_SERVER_HOST}"
  DEPLOY_PATH: "/opt/calculatrice"

# Cache Maven
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - calculatrice/.m2/repository/
    - calculatrice/target/
    - calculatrice/*/target/
    - calculatrice/microservices/*/target/

# Stages simplifiés
stages:
  - build
  - test
  - deploy

# ========================================
# Stage 1: Build et Package
# ========================================
build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Building and packaging all modules..."
    - cd calculatrice
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - calculatrice/Calaculatrice-eureka-service/target/*.jar
      - calculatrice/calculatrice-gateway/target/*.jar
      - calculatrice/microservices/addition-service/target/*.jar
      - calculatrice/microservices/subtraction-service/target/*.jar
      - calculatrice/microservices/multiplication-service/target/*.jar
      - calculatrice/microservices/division-service/target/*.jar
      - calculatrice/microservices/modulo-service/target/*.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

# ========================================
# Stage 2: Test
# ========================================
test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - postgres:15
  variables:
    POSTGRES_DB: "calculatrice_db"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "root"
  before_script:
    - echo "Waiting for PostgreSQL to be ready..."
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    - |
      for i in {1..30}; do
        if PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c '\q' 2>/dev/null; then
          echo "PostgreSQL is ready!"
          break
        fi
        echo "Waiting for PostgreSQL... ($i/30)"
        sleep 2
      done
    - echo "Initializing database schema..."
    - |
      PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB <<EOF
      CREATE TABLE IF NOT EXISTS calculation_history (
          id BIGSERIAL PRIMARY KEY,
          operation_type VARCHAR(50) NOT NULL,
          operand1 DECIMAL(20, 10) NOT NULL,
          operand2 DECIMAL(20, 10) NOT NULL,
          result DECIMAL(20, 10) NOT NULL,
          timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          service_name VARCHAR(100),
          user_id VARCHAR(100),
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS idx_operation_type ON calculation_history(operation_type);
      CREATE INDEX IF NOT EXISTS idx_timestamp ON calculation_history(timestamp);
      CREATE INDEX IF NOT EXISTS idx_user_id ON calculation_history(user_id);
      EOF
  script:
    - echo "Running tests..."
    - pwd
    - ls -la
    - |
      if [ ! -d "calculatrice" ]; then
        echo "ERROR: calculatrice directory not found!"
        ls -la
        exit 1
      fi
    - cd calculatrice
    - pwd
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - calculatrice/target/surefire-reports/TEST-*.xml
        - calculatrice/*/target/surefire-reports/TEST-*.xml
        - calculatrice/microservices/*/target/surefire-reports/TEST-*.xml
    paths:
      - calculatrice/target/surefire-reports/
      - calculatrice/*/target/surefire-reports/
      - calculatrice/microservices/*/target/surefire-reports/
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH

# ========================================
# Stage 3: Deploy (Sans SSH - Via Webhook ou API)
# ========================================
deploy:
  stage: deploy
  image: curlimages/curl:latest
  script:
    - echo "Deploying application (without SSH)..."
    - |
      # Option 1: Déploiement via Webhook (si serveur configuré)
      if [ ! -z "$DEPLOY_WEBHOOK_URL" ]; then
        echo "Deploying via webhook..."
        curl -X POST "$DEPLOY_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "{
            \"pipeline_id\": \"$CI_PIPELINE_ID\",
            \"commit\": \"$CI_COMMIT_SHA\",
            \"branch\": \"$CI_COMMIT_BRANCH\",
            \"artifacts_url\": \"$CI_JOB_URL/artifacts/download\",
            \"project_url\": \"$CI_PROJECT_URL\"
          }" || echo "Webhook call failed, but continuing..."
        echo "Webhook sent successfully!"
      else
        echo "DEPLOY_WEBHOOK_URL not set, skipping webhook deployment"
        echo ""
        echo "=========================================="
        echo "Artifacts disponibles pour téléchargement:"
        echo "=========================================="
        echo "Pipeline ID: $CI_PIPELINE_ID"
        echo "Job URL: $CI_JOB_URL"
        echo "Artifacts URL: $CI_JOB_URL/artifacts/download"
        echo ""
        echo "Pour télécharger les artifacts:"
        echo "1. Aller dans CI/CD > Pipelines > $CI_PIPELINE_ID"
        echo "2. Cliquer sur le job 'build'"
        echo "3. Cliquer sur 'Download' pour télécharger les fichiers JAR"
        echo ""
        echo "Pour activer le déploiement automatique via webhook:"
        echo "1. Configurer un webhook sur votre serveur"
        echo "2. Ajouter la variable DEPLOY_WEBHOOK_URL dans GitLab (Settings > CI/CD > Variables)"
        echo "   Exemple: http://votre-serveur:8080/webhook/deploy"
        echo "=========================================="
      fi
  environment:
    name: production
    url: http://${DEPLOY_SERVER_HOST:-localhost}:8080
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success

