# ========================================
# GitLab CI/CD Pipeline Configuration 
# ========================================

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  JAVA_VERSION: "17"
  
  # PostgreSQL
  POSTGRES_DB: "calculatrice_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "root"
  
  # Deployment
  DEPLOY_USER: "deployer"
  DEPLOY_HOST: "${DEPLOY_SERVER_HOST}"
  DEPLOY_PATH: "/opt/calculatrice"

# Cache Maven
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - calculatrice/.m2/repository/
    - calculatrice/target/
    - calculatrice/*/target/
    - calculatrice/microservices/*/target/

# Stages simplifiés
stages:
  - build
  - test
  - deploy

# ========================================
# Stage 1: Build et Package
# ========================================
build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - echo "Building and packaging all modules..."
    - cd calculatrice
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - calculatrice/Calaculatrice-eureka-service/target/*.jar
      - calculatrice/calculatrice-gateway/target/*.jar
      - calculatrice/microservices/addition-service/target/*.jar
      - calculatrice/microservices/subtraction-service/target/*.jar
      - calculatrice/microservices/multiplication-service/target/*.jar
      - calculatrice/microservices/division-service/target/*.jar
      - calculatrice/microservices/modulo-service/target/*.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH

# ========================================
# Stage 2: Test
# ========================================
test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  services:
    - postgres:15
  variables:
    POSTGRES_DB: "calculatrice_db"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "root"
  before_script:
    - echo "Waiting for PostgreSQL..."
    - apt-get update && apt-get install -y postgresql-client
    - until PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c '\q'; do sleep 1; done
    - cd calculatrice
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -f init-db.sql || true
  script:
    - echo "Running tests..."
    - cd calculatrice
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - calculatrice/target/surefire-reports/TEST-*.xml
        - calculatrice/*/target/surefire-reports/TEST-*.xml
        - calculatrice/microservices/*/target/surefire-reports/TEST-*.xml
    paths:
      - calculatrice/target/surefire-reports/
      - calculatrice/*/target/surefire-reports/
      - calculatrice/microservices/*/target/surefire-reports/
    expire_in: 1 week
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH

# ========================================
# Stage 3: Deploy (Simple)
# ========================================
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts || true
  script:
    - echo "Deploying application..."
    - |
      cd calculatrice
      if [ -f "scripts/deploy-dev.sh" ]; then
        chmod +x scripts/deploy-dev.sh
        ./scripts/deploy-dev.sh
      else
        echo "Deployment script not found, using simple deployment..."
        ssh $DEPLOY_USER@$DEPLOY_HOST "mkdir -p $DEPLOY_PATH"
        rsync -avz --progress \
          Calaculatrice-eureka-service/target/*.jar \
          calculatrice-gateway/target/*.jar \
          microservices/*/target/*.jar \
          $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/
        echo "Deployment completed!"
      fi
  environment:
    name: production
    url: http://$DEPLOY_HOST:8080
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
    - if: $CI_COMMIT_TAG
      when: on_success

